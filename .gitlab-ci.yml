stages:
  - test
  - deploy

variables:
  MAVEN_OPTS: >-
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository

default:
  image: maven:3.10-eclipse-temurin-27
  cache:
    key: maven-repository
    paths:
      - .m2/repository/

test:
  stage: test
  script:
    - mvn --batch-mode --no-transfer-progress verify

deploy-pages:
  stage: deploy
  script:
    - mvn --batch-mode --no-transfer-progress site
  pages:
    publish: target/site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
