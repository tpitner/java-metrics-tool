name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out java-metrics
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify release metadata
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(mvn --quiet help:evaluate \
            -Dexpression=project.version -DforceStdout)"
          citation_version="$(sed -n 's/^version:[[:space:]]*//p' CITATION.cff \
            | tr -d '"')"

          if [[ "$project_version" == *-SNAPSHOT ]]; then
            echo "Project version must not be a SNAPSHOT: $project_version" >&2
            exit 1
          fi
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag $tag_version does not match POM version $project_version" >&2
            exit 1
          fi
          if [[ "$tag_version" != "$citation_version" ]]; then
            echo "Tag $tag_version does not match CITATION.cff version $citation_version" >&2
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Build and run default test suite
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify packaged version provenance
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          jar="target/java-metrics-${version}.jar"
          manifest_version="$(unzip -p "$jar" META-INF/MANIFEST.MF \
            | sed -n 's/^Implementation-Version: //p' | tr -d '\r')"
          if [[ "$manifest_version" != "$version" ]]; then
            echo "JAR manifest version $manifest_version does not match $version" >&2
            exit 1
          fi
          json_version="$(java -jar "$jar" \
            --config examples/quickstart/java-metrics.toml --format json \
            | sed -n 's/.*"toolVersion": "\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ "$json_version" != "$version" ]]; then
            echo "Runtime provenance version $json_version does not match $version" >&2
            exit 1
          fi
          unzip -p "$jar" META-INF/java-metrics/LICENSE > /dev/null
          unzip -p "$jar" META-INF/java-metrics/NOTICE > /dev/null

      - name: Check out pinned CK revision
        uses: actions/checkout@v7
        with:
          repository: mauricioaniche/ck
          ref: 8a1ef916d597d33ad619d748b616bb7dbc3f0c36
          path: ck

      - name: Build pinned CK
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f ck/pom.xml -DskipTests package

      - name: Run real CK integration tests
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=CkActualIntegrationTest,CkValidationCorpusTest
          -Dck.jar=${{ github.workspace }}/ck/target/ck-0.7.1-SNAPSHOT-jar-with-dependencies.jar
          -Dck.java=${JAVA_HOME}/bin/java
          test

      - name: Prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          jar="target/java-metrics-${version}.jar"
          checksum="${jar}.sha256"
          test -f "$jar"
          (
            cd target
            shasum -a 256 "java-metrics-${version}.jar" \
              > "java-metrics-${version}.jar.sha256"
          )
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload verified workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: java-metrics-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.jar }}
            ${{ steps.artifacts.outputs.checksum }}
            LICENSE
            NOTICE
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${{ steps.artifacts.outputs.jar }}"
          "${{ steps.artifacts.outputs.checksum }}"
          LICENSE
          NOTICE
          --verify-tag
          --generate-notes
          --title "java-metrics ${{ steps.version.outputs.version }}"
