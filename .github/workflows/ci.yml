name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Java 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Smoke-test packaged CLI
        run: |
          cd examples/quickstart
          java -jar ../../target/java-metrics-1.0-SNAPSHOT.jar \
            --config java-metrics.toml \
            > actual.txt
          diff -u expected.txt actual.txt
          java -jar ../../target/java-metrics-1.0-SNAPSHOT.jar \
            --config java-metrics.toml --format json \
            > actual-1.json
          java -jar ../../target/java-metrics-1.0-SNAPSHOT.jar \
            --config java-metrics.toml --format json \
            > actual-2.json
          diff -u actual-1.json actual-2.json

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload packaged JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: java-metrics-${{ matrix.os }}
          path: target/java-metrics-1.0-SNAPSHOT.jar
          if-no-files-found: error

  real-ck-validation:
    name: Pinned CK integration / Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out java-metrics
        uses: actions/checkout@v4

      - name: Check out pinned CK revision
        uses: actions/checkout@v4
        with:
          repository: mauricioaniche/ck
          ref: 8a1ef91
          path: ck

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build pinned CK
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f ck/pom.xml -DskipTests package

      - name: Run real CK integration tests
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=CkActualIntegrationTest,CkValidationCorpusTest
          -Dck.jar=${{ github.workspace }}/ck/target/ck-0.7.1-SNAPSHOT-jar-with-dependencies.jar
          -Dck.java=${JAVA_HOME}/bin/java
          test

      - name: Upload CK test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ck-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
