name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Java 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Locate packaged JAR
        run: |
          project_version="$(mvn --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "JAR_PATH=target/java-metrics-${project_version}.jar" >> "$GITHUB_ENV"

      - name: Smoke-test packaged CLI
        run: |
          cd examples/quickstart
          java -jar "../../${JAR_PATH}" \
            --config java-metrics.toml \
            > actual.txt
          diff -u expected.txt actual.txt
          java -jar "../../${JAR_PATH}" \
            --config java-metrics.toml --format json \
            > actual-1.json
          java -jar "../../${JAR_PATH}" \
            --config java-metrics.toml --format json \
            > actual-2.json
          diff -u actual-1.json actual-2.json

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload packaged JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: java-metrics-${{ matrix.os }}
          path: ${{ env.JAR_PATH }}
          if-no-files-found: error

  real-ck-validation:
    name: Pinned CK integration / Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out java-metrics
        uses: actions/checkout@v7

      - name: Check out pinned CK revision
        uses: actions/checkout@v7
        with:
          repository: mauricioaniche/ck
          ref: 8a1ef916d597d33ad619d748b616bb7dbc3f0c36
          path: ck

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build pinned CK
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f ck/pom.xml -DskipTests package

      - name: Run real CK integration tests
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=CkActualIntegrationTest,CkValidationCorpusTest
          -Dck.jar=${{ github.workspace }}/ck/target/ck-0.7.1-SNAPSHOT-jar-with-dependencies.jar
          -Dck.java=${JAVA_HOME}/bin/java
          test

      - name: Upload CK test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-ck-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
